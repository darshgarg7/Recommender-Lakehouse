[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "marketplace-recommender-lakehouse"
version = "0.1.0"
description = "Replay-safe marketplace lakehouse and cold-start recommender"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Darsh"}]
dependencies = []

[project.optional-dependencies]
databricks = [
  "databricks-sdk>=0.50",
  "mlflow>=3.0",
  "pyspark>=3.5,<4",
]
ml = [
  "numpy>=2.0",
  "xgboost>=3.0",
]
serve = [
  "fastapi>=0.115",
  "uvicorn>=0.34",
]
sequence = [
  "numpy>=2.0",
  "torch>=2.3,<3",
  "mlflow>=3.0,<4",
]
vector-search = [
  "numpy>=2.0",
  "databricks-sdk>=0.50",
]
dev = [
  "coverage==7.15.2",
  "mypy==2.3.0",
  "PyYAML==6.0.3",
  "ruff==0.11.4",
]

[project.scripts]
marketplace-recommender = "marketplace_recommender.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/marketplace_recommender"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
follow_imports = "skip"
no_site_packages = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["marketplace_recommender"]
omit = [
  "*/pipelines/databricks*.py",
  "*/retrieval/sasrec_benchmark.py",
  "*/retrieval/sasrec_lineage.py",
  "*/retrieval/sasrec_model.py",
  "*/retrieval/sasrec_torch.py",
  "*/retrieval/sasrec_training.py",
  "*/retrieval/spark_als*.py",
  "*/retrieval/vector_search.py",
  "*/serving/endpoint.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
