[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "marketplace-recommender-lakehouse"
version = "0.1.0"
description = "Replay-safe marketplace lakehouse and cold-start recommender"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Darsh"}]
dependencies = []

[project.optional-dependencies]
databricks = [
  "databricks-sdk>=0.50",
  "mlflow>=3.0",
  "pyspark>=3.5,<4",
]
ml = [
  "numpy>=2.0",
  "xgboost>=3.0",
]
serve = [
  "fastapi>=0.115",
  "uvicorn>=0.34",
]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
]

[project.scripts]
marketplace-recommender = "marketplace_recommender.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/marketplace_recommender"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
