bundle:
  name: marketplace-recommender-lakehouse

artifacts:
  default:
    type: whl
    build: python3 -m pip wheel . -w dist
    path: .

variables:
  catalog:
    default: workspace
  schema_prefix:
    default: ""
  source_domain:
    default: Magazine_Subscriptions
  volume_root:
    default: /Volumes/workspace/default/marketplace_landing
  reviews_checksum:
    default: bf36b04bbfb41f43c49b4adbdc13969014311ffb2344f706d13c35cdea5662da
  metadata_checksum:
    default: b325bc690a4b705338dfc3dd45ace5ec643dc6212cbb0c614a9b05f236ec12ab

resources:
  jobs:
    marketplace_pipeline:
      name: marketplace-recommender-${bundle.target}
      max_concurrent_runs: 1
      tasks:
        - task_key: bootstrap
          environment_key: default
          spark_python_task:
            python_file: ./scripts/databricks_entrypoint.py
            parameters:
              - --stage
              - bootstrap
              - --catalog
              - ${var.catalog}
              - --schema-prefix
              - ${var.schema_prefix}
              - --source-domain
              - ${var.source_domain}
              - --volume-root
              - ${var.volume_root}
              - --reviews-checksum
              - ${var.reviews_checksum}
              - --metadata-checksum
              - ${var.metadata_checksum}
        - task_key: bronze_reviews
          depends_on:
            - task_key: bootstrap
          environment_key: default
          spark_python_task:
            python_file: ./scripts/databricks_entrypoint.py
            parameters:
              - --stage
              - bronze
              - --source-kind
              - reviews
              - --source-path
              - ${var.volume_root}/reviews
              - --catalog
              - ${var.catalog}
              - --schema-prefix
              - ${var.schema_prefix}
        - task_key: bronze_metadata
          depends_on:
            - task_key: bootstrap
          environment_key: default
          spark_python_task:
            python_file: ./scripts/databricks_entrypoint.py
            parameters:
              - --stage
              - bronze
              - --source-kind
              - metadata
              - --source-path
              - ${var.volume_root}/metadata
              - --catalog
              - ${var.catalog}
              - --schema-prefix
              - ${var.schema_prefix}
        - task_key: silver
          depends_on:
            - task_key: bronze_reviews
            - task_key: bronze_metadata
          environment_key: default
          spark_python_task:
            python_file: ./scripts/databricks_entrypoint.py
            parameters:
              - --stage
              - silver
              - --catalog
              - ${var.catalog}
              - --schema-prefix
              - ${var.schema_prefix}
        - task_key: gold
          depends_on:
            - task_key: silver
          environment_key: default
          spark_python_task:
            python_file: ./scripts/databricks_entrypoint.py
            parameters:
              - --stage
              - gold
              - --catalog
              - ${var.catalog}
              - --schema-prefix
              - ${var.schema_prefix}
        - task_key: certify
          depends_on:
            - task_key: gold
          environment_key: default
          spark_python_task:
            python_file: ./scripts/databricks_entrypoint.py
            parameters:
              - --stage
              - certify
              - --catalog
              - ${var.catalog}
              - --schema-prefix
              - ${var.schema_prefix}
              - --job-run-id
              - "{{job.run_id}}"
              - --job-id
              - "{{job.id}}"
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ${workspace.artifact_path}/.internal/marketplace_recommender_lakehouse-0.1.0-py3-none-any.whl

targets:
  dev:
    default: true
    mode: development
    variables:
      catalog: workspace
  staging:
    mode: production
    variables:
      catalog: workspace
  prod:
    mode: production
    variables:
      catalog: workspace
  scale:
    mode: development
    variables:
      catalog: workspace
      schema_prefix: scale
      source_domain: Appliances
      volume_root: /Volumes/workspace/default/marketplace_landing/scale/appliances
      reviews_checksum: d9dd03aa9be0c8e6fea66d8ce99a7e5b359e272d6323186c1aa80f6d36af1dab
      metadata_checksum: b25ae892af7bc452c4a54b7e4fee52f4c3e9adf058768ca3cb07ecb8d328b41e
